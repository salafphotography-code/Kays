function absen(){const ss=act(AS.k),key=AS.k+'|'+AS.d,ex=db.absen[key];
const pc=id=>{const r=Object.entries(db.absen).filter(([k])=>k.startsWith(AS.k+'|')).map(([,o])=>o[id]).filter(Boolean);return r.length?Math.round(r.filter(x=>x==='Hadir').length/r.length*100)+'%':'–'};
$('#pg').innerHTML=`<div class="hd"><h1>Absensi</h1><button class="btn" id="ae">${ic('dl')}Ekspor CSV</button></div><div class="card tw"><div class="tools" style="padding:16px 16px 0"><select id="ak" aria-label="Kelas">${opt(db.kelas,AS.k,'Pilih kelas')}</select><input type="date" id="ad" aria-label="Tanggal" value="${AS.d}"></div>${AS.k&&ss.length?`${ex?`<p style="padding:0 16px"><span class="bd inf">${ic('ok')}Absensi tanggal ini sudah tercatat. Menyimpan akan memperbarui, bukan menggandakan.</span></p>`:''}<table><thead><tr><th>Siswa</th><th>Status hari ini</th><th>Kehadiran</th></tr></thead><tbody>${ss.map(s=>`<tr><td data-l="Siswa">${esc(s.nama)}</td><td data-l="Status"><select class="as" data-s="${s.id}" aria-label="Status ${esc(s.nama)}">${ST.map(x=>`<option ${((ex||{})[s.id]||'Hadir')===x?'selected':''}>${x}</option>`).join('')}</select></td><td data-l="Kehadiran">${pc(s.id)}</td></tr>`).join('')}</tbody></table><div style="padding:16px"><button class="btn p" id="asv">Simpan absensi</button></div>`:empty('Pilih kelas','Pilih kelas dan tanggal. Semua siswa otomatis Hadir; ubah hanya yang Sakit, Izin, atau Alpa.')}</div>`;
$('#ak').onchange=e=>{AS.k=e.target.value;absen()};$('#ad').onchange=e=>{if(e.target.value){AS.d=e.target.value;absen()}};
if($('#asv'))$('#asv').onclick=()=>{const o={};document.querySelectorAll('.as').forEach(s=>o[s.dataset.s]=s.value);db.absen[key]=o;logA('Absensi '+kn(AS.k)+' '+AS.d);if(save()){toast('Absensi tersimpan');absen()}};
$('#ae').onclick=()=>{const L=[['tanggal','kelas','nama','status'].map(q).join(',')];Object.entries(db.absen).sort().forEach(([k,o])=>{const[kl,d]=k.split('|');Object.entries(o).forEach(([id,st])=>{const s=db.siswa.find(x=>x.id===id);if(s)L.push([d,kn(kl),s.nama,st].map(q).join(','))})});if(L.length<2){toast('Belum ada absensi untuk diekspor.');return}dl('absensi.csv','\ufeff'+L.join('\r\n'),'text/csv')}}
// settings + style guide
function set(){const dk=document.documentElement.dataset.theme==='dark';$('#pg').innerHTML=`<div class="hd"><h1>Pengaturan</h1></div><div class="grid g2" style="margin:0">
<div class="card"><h3 style="margin-bottom:16px">Profil guru</h3><div class="f"><label for="pn">Nama</label><input id="pn" value="${esc(db.nama)}"></div><div class="f"><label for="kk">KKM (nilai minimum tuntas)</label><input id="kk" type="number" min="0" max="100" value="${db.kkm||75}"></div><button class="btn p" id="ps">Simpan profil</button></div>
<div class="card"><h3 style="margin-bottom:16px">Tampilan</h3><label style="display:flex;gap:12px;align-items:center"><input type="checkbox" id="dm" style="width:24px;min-height:24px" ${dk?'checked':''}>Mode gelap</label><p style="margin-top:16px"><a href="#gaya">Lihat panduan gaya desain</a></p></div>
<div class="card"><h3 style="margin-bottom:16px">Bobot nilai (harus 100%)</h3>${Object.keys(WL).map(k=>`<div class="f"><label for="w_${k}">${WL[k]} (%)</label><input id="w_${k}" type="number" min="0" max="100" value="${db.w[k]}"></div>`).join('')}<div class="err" id="we"></div><button class="btn p" id="ws">Simpan bobot</button></div>
<div class="card"><h3 style="margin-bottom:8px">Cadangan data</h3><p class="sm">Data hanya tersimpan di peramban ini. Unduh cadangan secara berkala.</p><button class="btn" id="bk">${ic('dl')}Unduh cadangan</button> <button class="btn" id="rs">${ic('up')}Pulihkan dari file</button></div>
<div class="card"><h3 style="margin-bottom:8px">Data contoh</h3><p class="sm">${db.demo?'Aplikasi memuat siswa contoh (fiktif) untuk uji coba.':'Data contoh sudah dihapus.'}</p><button class="btn d" id="dd" ${db.demo?'':'disabled'}>${ic('trash')}Hapus data contoh</button></div></div>`;
$('#ps').onclick=()=>{db.nama=$('#pn').value.trim();db.kkm=Math.min(100,Math.max(0,+$('#kk').value||75));save();toast('Profil tersimpan')};
$('#ws').onclick=()=>{const w={};let t=0;Object.keys(WL).forEach(k=>{w[k]=+$('#w_'+k).value||0;t+=w[k]});if(t!==100){$('#we').textContent='Total bobot sekarang '+t+'%. Ubah angkanya sampai tepat 100%.';return}$('#we').textContent='';db.w=w;logA('Mengubah bobot nilai');save();toast('Bobot tersimpan')};
$('#dm').onchange=e=>{const t=e.target.checked?'dark':'light';document.documentElement.dataset.theme=t;lss('salafdkv_theme',t)};
$('#bk').onclick=()=>dl('cadangan-salafdkv.json',JSON.stringify(db),'application/json');
$('#rs').onclick=()=>{const f=document.createElement('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{const d=JSON.parse(await f.files[0].text());if(!d.siswa||!d.kelas||!d.mapel)throw 0;db=d;save();toast('Data dipulihkan');route()}catch(x){toast('File cadangan tidak valid. Pilih file .json hasil Unduh cadangan.')}};f.click()};
$('#dd').onclick=()=>conf('Siswa contoh (NIS berawalan DEMO) beserta nilai dan absensinya akan dihapus. Kelas, mata pelajaran, dan data yang Anda tambah sendiri tetap aman.',()=>{db.siswa.filter(x=>String(x.nis).startsWith('DEMO')).forEach(x=>clean('siswa',x.id));db.siswa=db.siswa.filter(x=>!String(x.nis).startsWith('DEMO'));db.demo=false;logA('Menghapus siswa contoh');save();toast('Data contoh dihapus');set()})}
function gaya(){const c=[['Primary','#12183A'],['Hover','#0B1030'],['Biru','#3046E8'],['Cyan','#00A3D9'],['Magenta','#E5287A'],['Kuning','#FFC21A'],['Latar','#F3F5FA'],['Border','#E2E8F0'],['Sukses','#16A34A'],['Peringatan','#B45309'],['Bahaya','#DC2626'],['Info','#0369A1']];
$('#pg').innerHTML=`<div class="hd"><h1>Panduan Gaya</h1><a class="btn" href="#set">Kembali</a></div><div class="card"><h3 style="margin-bottom:16px">Warna</h3><div class="sw">${c.map(([n,h])=>`<div><i style="background:${h}"></i><span>${n}<br>${h}</span></div>`).join('')}</div></div>
<div class="card" style="margin-top:24px"><h3 style="margin-bottom:16px">Tipografi</h3><h1>H1 Bricolage Grotesque 30</h1><h2>H2 22</h2><h3>H3 18</h3><p>Isi teks Public Sans 15px dengan tinggi baris 1.5.</p><p class="sm">Keterangan 13px.</p></div>
<div class="card" style="margin-top:24px"><h3 style="margin-bottom:16px">Komponen</h3><p><button class="btn p">Aksi utama</button> <button class="btn">Outline</button> <button class="btn d">Hapus</button> <button class="btn" disabled>Nonaktif</button></p><p><span class="bd ok">${ic('ok')}Aktif</span> <span class="bd wa">${ic('arr')}Pindah</span> <span class="bd er">${ic('trash')}Terlambat</span> <span class="bd inf">${ic('award')}Lulus</span></p><div class="f" style="max-width:320px"><label for="g1">Label di atas kolom</label><input id="g1" placeholder="Contoh isian"></div><div class="f" style="max-width:320px"><label for="g2">Kolom galat</label><input id="g2" style="border-color:var(--er)"><div class="err">Kolom wajib diisi. Isi lalu simpan lagi.</div></div></div>`}
function clean(n,id){if(n==='siswa'){Object.keys(db.nilai).forEach(k=>{if(k.endsWith('|'+id))delete db.nilai[k]});Object.values(db.absen).forEach(o=>delete o[id]);db.galeri=db.galeri.filter(g=>g.siswa!==id)}if(n==='mapel')Object.keys(db.nilai).forEach(k=>{if(k.startsWith(id+'|'))delete db.nilai[k]});if(n==='kelas')Object.keys(db.absen).forEach(k=>{if(k.startsWith(id+'|'))delete db.absen[k]})}
function att(){const r=Object.values(db.absen).flatMap(o=>Object.values(o));if(!r.length)return'<p class="sm">Belum ada absensi. Catat kehadiran di menu Absensi.</p>';const C={Hadir:'#00A3D9',Sakit:'#FFC21A',Izin:'#7C8AF5',Alpa:'#E5287A'},n=x=>r.filter(v=>v===x).length;return`<div class="stk" role="img" aria-label="Komposisi kehadiran">${ST.map(x=>n(x)?`<i style="flex:${n(x)};background:${C[x]}"></i>`:'').join('')}</div><div class="lg">${ST.map(x=>`<span><i style="background:${C[x]}"></i>${x} <b>${n(x)}</b></span>`).join('')}</div>`}
const shrink=f=>new Promise(r=>{const i=new Image,u=URL.createObjectURL(f);i.onerror=()=>r('');i.onload=()=>{const k=Math.min(1,720/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.7))};i.src=u});
function galeri(){const g=db.galeri;
$('#pg').innerHTML=`<div class="hd"><div><h1>Galeri Karya</h1><span class="sm">${g.length} karya fotografi dan desain siswa</span></div><button class="btn p" id="ga">${ic('plus')}Unggah karya</button></div>${g.length?`<div class="gal">${g.map(x=>`<figure class="card gi"><img src="${x.img}" alt="${esc(x.judul)}" loading="lazy"><figcaption><b>${esc(x.judul)}</b><span class="sm">${esc((db.siswa.find(s=>s.id===x.siswa)||{}).nama||'Tanpa nama siswa')}${x.mapel?' – '+esc((db.mapel.find(m=>m.id===x.mapel)||{}).nama||''):''}</span><button class="btn t er" data-g="${x.id}" aria-label="Hapus ${esc(x.judul)}">${ic('trash')}</button></figcaption></figure>`).join('')}</div>`:`<div class="card">${empty('Belum ada karya','Unggah foto hasil tugas siswa. Gambar otomatis dikecilkan agar muat di peramban.','')}</div>`}`;
$('#ga').onclick=()=>{modal(`<h3 style="margin-bottom:16px">Unggah karya</h3><form id="gf" novalidate><div class="f"><label for="gj">Judul karya *</label><input id="gj"></div><div class="f"><label for="gs2">Siswa</label><select id="gs2">${opt(db.siswa,'','Pilih siswa')}</select></div><div class="f"><label for="gm">Mata pelajaran</label><select id="gm">${opt(db.mapel,'','Pilih mapel')}</select></div><div class="f"><label for="gi">Foto *</label><input id="gi" type="file" accept="image/*"></div><div class="err" id="ge"></div><div class="ac"><button type="button" class="btn" onclick="closeM()">Batal</button><button class="btn p">Simpan</button></div></form>`);
$('#gf').onsubmit=async e=>{e.preventDefault();const j=$('#gj').value.trim(),f=$('#gi').files[0],img=f?await shrink(f):'';if(!j||!img){$('#ge').textContent='Judul dan foto wajib diisi, dan file harus berupa gambar. Lengkapi lalu simpan lagi.';return}
db.galeri.unshift({id:uid(),judul:j,siswa:$('#gs2').value,mapel:$('#gm').value,img});logA('Mengunggah karya: '+j);if(save()){closeM();toast('Karya tersimpan');galeri()}else db.galeri.shift()}};
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>conf('Karya ini akan dihapus dan tidak bisa dikembalikan.',()=>{db.galeri=db.galeri.filter(x=>x.id!==b.dataset.g);save();galeri()}))}
let LS='';
function laporan(){const ss=act(LS),kk=db.kkm||75;
const R=ss.map(s=>{const v=db.mapel.map(m=>fin(db.nilai[m.id+'|'+s.id])).filter(x=>x!==null),h=Object.entries(db.absen).filter(([k])=>k.startsWith(LS+'|')).map(([,o])=>o[s.id]).filter(Boolean),c=x=>h.filter(y=>y===x).length;return{n:s.nama,a:v.length?v.reduce((x,y)=>x+y,0)/v.length:null,p:h.length?Math.round(c('Hadir')/h.length*100):null,s:c('Sakit'),i:c('Izin'),x:c('Alpa')}});
const tk=a=>a===null?'<span class="bd wa">Belum ada nilai</span>':a>=kk?`<span class="bd ok">${ic('ok')}Tuntas</span>`:'<span class="bd er">Remedial</span>';
$('#pg').innerHTML=`<div class="hd"><div><h1>Laporan</h1><span class="sm">Rekap nilai akhir dan kehadiran per kelas. KKM ${kk}</span></div><button class="btn" id="le2">${ic('dl')}Ekspor CSV</button></div><div class="card tw"><div class="tools" style="padding:16px 16px 0"><select id="lk" aria-label="Kelas">${opt(db.kelas,LS,'Pilih kelas')}</select></div>${R.length?`<table><thead><tr><th>Siswa</th><th>Rata-rata nilai</th><th>Ketuntasan</th><th>Kehadiran</th><th>Sakit</th><th>Izin</th><th>Alpa</th></tr></thead><tbody>${R.map(r=>`<tr><td data-l="Siswa">${esc(r.n)}</td><td data-l="Rata-rata nilai">${r.a===null?'–':'<b>'+r.a.toFixed(1)+'</b>'}</td><td data-l="Ketuntasan">${tk(r.a)}</td><td data-l="Kehadiran">${r.p===null?'–':r.p+'%'}</td><td data-l="Sakit">${r.s}</td><td data-l="Izin">${r.i}</td><td data-l="Alpa">${r.x}</td></tr>`).join('')}</tbody></table>`:empty('Pilih kelas','Rekap muncul setelah kelas dipilih dan nilai atau absensi tercatat.')}</div>`;
$('#lk').onchange=e=>{LS=e.target.value;laporan()};
$('#le2').onclick=()=>{if(!R.length){toast('Pilih kelas dulu, lalu ekspor.');return}dl('laporan.csv','\ufeff'+[['nama','rata-rata nilai','ketuntasan','kehadiran %','sakit','izin','alpa'].map(q).join(',')].concat(R.map(r=>[r.n,r.a===null?'':r.a.toFixed(1),r.a===null?'Belum ada nilai':r.a>=kk?'Tuntas':'Remedial',r.p??'',r.s,r.i,r.x].map(q).join(','))).join('\r\n'),'text/csv')}}
// init
{const t=lsg('salafdkv_theme');if(t)document.documentElement.dataset.theme=t;lui();let s=false;try{s=sessionStorage.getItem('in')}catch(e){}if(s&&user)enter()}
</script></body></html>
